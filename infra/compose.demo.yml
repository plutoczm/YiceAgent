name: workflowops-demo
services:
  postgres:
    image: postgres:16.13-trixie
    environment:
      POSTGRES_DB: workflowops_demo
      POSTGRES_USER: workflowops_demo
      POSTGRES_PASSWORD: ${WORKFLOWOPS_DEMO_DB_PASSWORD:?Set a local demo password}
    ports:
      - "127.0.0.1:55432:5432"
    labels:
      com.workflowops.owner: workflowops-demo
    volumes:
      - workflowops_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflowops_demo -d workflowops_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  workflowops_demo_pgdata:
    labels:
      com.workflowops.owner: workflowops-demo
