name: datacopilot

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-backend-env: &backend-env
  DATACOPILOT_ENVIRONMENT: production
  DATACOPILOT_DEBUG: "false"
  DATACOPILOT_PATHS__PROJECT_ROOT: /app
  DATACOPILOT_PATHS__DATA_DIR: data
  DATACOPILOT_PATHS__CHROMADB_DIR: data/chromadb
  DATACOPILOT_PATHS__UPLOADS_DIR: data/uploads
  DATACOPILOT_PATHS__LOGS_DIR: data/logs
  DATACOPILOT_PATHS__CACHE_DIR: data/cache
  DATACOPILOT_PATHS__EMBEDDINGS_DIR: data/embeddings
  DATACOPILOT_PATHS__TEMP_DIR: data/temp
  DATACOPILOT_PATHS__MODELS_DIR: models
  DATACOPILOT_VECTOR_STORE__MODE: http
  DATACOPILOT_VECTOR_STORE__HOST: chromadb
  DATACOPILOT_VECTOR_STORE__PORT: "8000"
  DATACOPILOT_VECTOR_STORE__SSL: "false"
  DATACOPILOT_MEMORY__BACKEND: redis
  DATACOPILOT_MEMORY__REDIS_URL: redis://redis:6379/0
  DATACOPILOT_EMBEDDINGS__DEFAULT_MODEL: BAAI/bge-m3
  DATACOPILOT_EMBEDDINGS__DEVICE: ${EMBEDDING_DEVICE:-cpu}
  DATACOPILOT_EMBEDDINGS__USE_FP16: ${EMBEDDING_USE_FP16:-false}
  DATACOPILOT_LOGGING__FILE_PATH: data/logs/datacopilot.log
  DATACOPILOT_LLM__DEFAULT_PROVIDER: ${LLM_PROVIDER:-deepseek}
  DATACOPILOT_OLLAMA__ENABLED: ${OLLAMA_ENABLED:-false}
  DATACOPILOT_OLLAMA__BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  DATACOPILOT_OLLAMA__CHAT_MODEL: ${OLLAMA_MODEL:-qwen3}
  DATACOPILOT_LLM__ROUTING_ENABLED: ${ROUTING_ENABLED:-false}
  DATACOPILOT_LLM__CLOUD_PROVIDER: ${CLOUD_PROVIDER:-deepseek}
  DATACOPILOT_LLM__ROUTING_FALLBACK_TO_CLOUD: ${ROUTING_FALLBACK:-true}
  DATACOPILOT_LOCAL__ENABLED: ${LOCAL_MODEL_ENABLED:-false}
  DATACOPILOT_LOCAL__BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://ollama:11434/v1}
  DATACOPILOT_LOCAL__CHAT_MODEL: ${LOCAL_MODEL_NAME:-datacopilot-qwen3-8b}

services:
  redis:
    image: redis:7.4-alpine
    container_name: datacopilot-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: "1.0"
    mem_limit: 1g
    networks:
      - datacopilot
    logging: *common-logging

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: datacopilot-chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: "8000"
    ports:
      - "${CHROMADB_PORT:-8001}:8000"
    volumes:
      - type: bind
        source: ./data/chromadb
        target: /chroma/chroma
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    cpus: "2.0"
    mem_limit: 4g
    networks:
      - datacopilot
    logging: *common-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DATACOPILOT_UID: ${DATACOPILOT_UID:-1014}
        DATACOPILOT_GID: ${DATACOPILOT_GID:-1015}
    image: datacopilot-backend:${DATACOPILOT_IMAGE_TAG:-0.1.0}
    container_name: datacopilot-backend
    restart: unless-stopped
    env_file:
      - path: docker/.env.production
        required: true
      - path: .env
        required: false
    environment: *backend-env
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./models
        target: /app/models
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/health/live >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
    cpus: "4.0"
    mem_limit: 8g
    networks:
      - datacopilot
    logging: *common-logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        DATACOPILOT_UID: ${DATACOPILOT_UID:-1014}
        DATACOPILOT_GID: ${DATACOPILOT_GID:-1015}
    image: datacopilot-frontend:${DATACOPILOT_IMAGE_TAG:-0.1.0}
    container_name: datacopilot-frontend
    restart: unless-stopped
    env_file:
      - docker/.env.production
    environment:
      BACKEND_URL: http://backend:8000
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    cpus: "1.0"
    mem_limit: 2g
    networks:
      - datacopilot
    logging: *common-logging

  ollama:
    image: ollama/ollama:0.12.10
    container_name: datacopilot-ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - type: bind
        source: ./data/ollama
        target: /root/.ollama
    healthcheck:
      test:
        - CMD-SHELL
        - ollama list >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
    cpus: "4.0"
    mem_limit: 8g
    networks:
      - datacopilot
    logging: *common-logging

networks:
  datacopilot:
    name: datacopilot
    driver: bridge
