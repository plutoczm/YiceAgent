name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  pytest:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r frontend/requirements.txt -r requirements-dev.txt

      - name: Prepare runtime directories
        run: |
          mkdir -p data/chromadb data/uploads data/logs data/cache data/embeddings data/temp data/models data/ollama

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Run deterministic enterprise analytics evaluation
        run: |
          python -m tests.evaluation.run_business_analytics_evaluation

      - name: Run coverage
        run: |
          python -m pytest --cov=backend --cov=frontend --cov-report=term-missing --cov-fail-under=85

  container-smoke:
    runs-on: ubuntu-22.04
    needs: pytest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for HTTP smoke assertions
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag datacopilot-backend:${{ github.sha }} .

      - name: Verify runtime imports, dependency versions, and accepted Contract
        run: |
          docker run --rm datacopilot-backend:${{ github.sha }} python -c "import cryptography, duckdb, jwt, sqlglot; import backend.app; import backend.app.application.agent.business_analytics_adapter; import backend.app.application.business_analytics.managed_text2sql; import backend.app.composition.business_analytics; import backend.app.infrastructure.business_analytics.delivery_v2; import backend.app.infrastructure.business_analytics.duckdb_executor; import backend.app.infrastructure.business_data.contract_catalog; import backend.app.infrastructure.identity.pyjwt_jwks_provider; import backend.app.presentation.api.routes.business_analytics; assert sqlglot.__version__ == '30.19.0'; assert duckdb.__version__ == '1.5.5'; assert jwt.__version__ == '2.15.0'; print(f'sqlglot={sqlglot.__version__} duckdb={duckdb.__version__} PyJWT={jwt.__version__} cryptography={cryptography.__version__}')"
          docker run --rm datacopilot-backend:${{ github.sha }} python -c "import hashlib; from pathlib import Path; p=Path('/app/contracts/external/business_data/v1/contract.json'); digest=hashlib.sha256(p.read_bytes()).hexdigest(); expected='7c718f38934a9105d3529b32f24b62c08a1e86f7d9ea634668a35039aa427d2b'; assert digest == expected, digest; print(f'accepted_contract_sha256={digest}')"

      - name: Start minimal backend container
        run: >-
          docker run --detach --name datacopilot-backend-smoke
          --publish 127.0.0.1:8000:8000
          --env DATACOPILOT_IDENTITY__ENABLED=false
          --env DATACOPILOT_BUSINESS_ANALYTICS__ENABLED=false
          datacopilot-backend:${{ github.sha }}

      - name: Check health, OpenAPI security, and fail-closed authentication
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs datacopilot-backend-smoke
            exit 1
          fi
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=5) as response:
              assert response.status == 200
          with urllib.request.urlopen("http://127.0.0.1:8000/openapi.json", timeout=10) as response:
              schema = json.load(response)
          operation = schema["paths"]["/api/v1/business-analytics/query"]["post"]
          assert operation.get("security") == [{"BearerAuth": []}], operation.get("security")
          assert schema["components"]["securitySchemes"]["BearerAuth"] == {
              "type": "http", "scheme": "bearer"
          }
          request_schema = operation["requestBody"]["content"]["application/json"]["schema"]
          if "$ref" in request_schema:
              component_name = request_schema["$ref"].rsplit("/", 1)[-1]
              request_schema = schema["components"]["schemas"][component_name]
          forbidden = {
              "tenant_id", "user_id", "schema_context", "delivery_path", "database_url",
              "credentials", "contract_name", "contract_version", "timeout", "max_rows",
          }
          properties = set(request_schema.get("properties", {}))
          assert not properties.intersection(forbidden), properties.intersection(forbidden)

          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/business-analytics/query",
              data=b'{"question":"orders"}',
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 401, error.code
          else:
              raise AssertionError("unauthenticated managed query was accepted")

          invalid_bearer = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/business-analytics/query",
              data=b'{"question":"orders"}',
              headers={
                  "Authorization": "Bearer not-a-jwt",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              invalid_response = urllib.request.urlopen(invalid_bearer, timeout=10)
              invalid_status = invalid_response.status
          except urllib.error.HTTPError as error:
              invalid_status = error.code
          assert invalid_status != 200, invalid_status
          print("health=PASS openapi_bearer=PASS request_schema=PASS unauthenticated_query=401 invalid_bearer=NOT_200")
          PY

      - name: Stop smoke container
        if: always()
        run: docker rm --force datacopilot-backend-smoke 2>/dev/null || true
